name: Build ROM GUI (msvc)
on: [push]
# on: [workflow_dispatch]

jobs:
  Build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build
        working-directory: ./romgui
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\Common7\Tools\VsDevCmd.bat"
          msbuild /p:PlatformToolset=v143 /p:Configuration=Release
      - uses: actions/upload-artifact@v4
        with:
          name: romgui
          path: romgui/Release/gbinject.exe
